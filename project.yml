# Fallback project definition. The committed Ullage.xcodeproj is hand-written and
# should open directly in Xcode 16+; regenerate with `xcodegen generate` only if
# it ever gets into a bad state.
name: Ullage
options:
  bundleIdPrefix: com.ullage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UllageCore:
    path: Core

targets:
  Ullage:
    type: application
    platform: iOS
    sources:
      - path: Ullage
    dependencies:
      - package: UllageCore
        product: UllageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ullage.Ullage
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        ENABLE_PREVIEWS: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Ullage uses the camera to photograph wine labels so they can be identified.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ullage reads photos of wine labels you choose so they can be identified.
